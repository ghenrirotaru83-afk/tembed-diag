; T-Embed CC1101 diagnostic firmware
; Target: LilyGO T-Embed CC1101 (ESP32-S3, 16MB flash, 8MB OPI PSRAM)
; Framework: Arduino via PlatformIO. Board definition vendored in ./boards.
;
; Build:  pio run
; Flash:  pio run -t upload          (native USB-C, no adapter needed)
; Serial: pio device monitor

[platformio]
default_envs = T_Embed_CC1101
boards_dir = boards

[env:T_Embed_CC1101]
platform = espressif32@6.13.0
board = T_Embed_PN532
framework = arduino

upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

build_unflags =
    -std=gnu++11

build_flags =
    -std=gnu++17
    -Iinclude

    ; USB-CDC so Serial works over the native USB port
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1
    -DDISABLE_ALL_LIBRARY_WARNINGS=1

    ; Adafruit PN532 in I2C mode (this board wires the PN532 to the shared I2C bus)
    -DNFC_INTERFACE_I2C=1

    ; RadioLib low-level access + static allocation (matches vendor CC1101 examples)
    -DRADIOLIB_LOW_LEVEL=1
    -DRADIOLIB_STATIC_ONLY=1

    ; XPowersLib: BQ25896 charger only; fuel gauge is read directly (see bq27220_min)
    -DXPOWERS_CHIP_BQ25896=1

    ; ---- LVGL ----
    -DLV_CONF_INCLUDE_SIMPLE=1

    ; ---- TFT_eSPI (matches vendor Setup214_LilyGo_T_Embed_PN532.h) ----
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=170
    -DTFT_HEIGHT=320
    -DUSE_HSPI_PORT=1
    -DTFT_INVERSION_ON=1
    -DTFT_BL=21
    -DTFT_MISO=10
    -DTFT_MOSI=9
    -DTFT_SCLK=11
    -DTFT_CS=41
    -DTFT_DC=16
    -DTFT_RST=-1
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=20000000

lib_deps =
    bodmer/TFT_eSPI@2.5.43
    lvgl/lvgl@8.3.11
    jgromes/RadioLib@7.7.1
    adafruit/Adafruit PN532@1.3.4
    adafruit/Adafruit NeoPixel@1.12.3
    crankyoldgit/IRremoteESP8266@2.8.6
    mathertel/RotaryEncoder@1.5.3
    lewisxhe/XPowersLib@^0.3.0
    ; Core libraries that PlatformIO's dependency finder does not expose to
    ; project sources: reference them explicitly from the framework package.
    ${platformio.packages_dir}/framework-arduinoespressif32/libraries/WiFi
    ${platformio.packages_dir}/framework-arduinoespressif32/libraries/BLE
    ${platformio.packages_dir}/framework-arduinoespressif32/libraries/SD
